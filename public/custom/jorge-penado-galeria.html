<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jorge Penado Siancas — Recuerdos de Vida</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        script: ['"Great Vibes"', 'cursive'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        night: { 950: '#090e1a', 900: '#0f172a', 800: '#162032', 700: '#1e2c44' },
                        ivory: { 50: '#fdfcfa', 100: '#faf7f2', 200: '#f0e9dc' },
                        antique: { 300: '#e2c56b', 400: '#c59b27', 500: '#a67f1a', 600: '#856310' }
                    }
                }
            }
        }
    </script>

    <style>
        :root { --gold: #c59b27; --gold-light: #e2c56b; --night: #0f172a; --night-card: #162032; --ivory: #faf7f2; }
        body { background-color: #0f172a; color: #faf7f2; overflow: hidden; user-select: none; }
        .cinematic-vignette { background: radial-gradient(circle at center, transparent 42%, rgba(9, 14, 26, 0.78) 100%); }

        .kb-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1); will-change: opacity; }
        .kb-slide.active { opacity: 1; z-index: 2; }
        .kb-slide.previous { opacity: 0; z-index: 1; }
        .kb-img { width: 100%; height: 100%; object-fit: contain; background: #090e1a; will-change: transform; }

        .kb-motion-0 { animation: kenBurnsZoomIn 11s ease-out forwards; }
        .kb-motion-1 { animation: kenBurnsPanRight 11s ease-out forwards; }
        .kb-motion-2 { animation: kenBurnsZoomOut 11s ease-out forwards; }
        .kb-motion-3 { animation: kenBurnsPanLeft 11s ease-out forwards; }

        @keyframes kenBurnsZoomIn { 0% { transform: scale(1.0) translate(0%, 0%); } 100% { transform: scale(1.13) translate(-1.5%, -1%); } }
        @keyframes kenBurnsPanRight { 0% { transform: scale(1.12) translate(-2.5%, 0.5%); } 100% { transform: scale(1.04) translate(2%, -1%); } }
        @keyframes kenBurnsZoomOut { 0% { transform: scale(1.14) translate(1%, 1%); } 100% { transform: scale(1.01) translate(-1%, -0.5%); } }
        @keyframes kenBurnsPanLeft { 0% { transform: scale(1.11) translate(2.5%, -1%); } 100% { transform: scale(1.03) translate(-2%, 1%); } }

        .polaroid-stage { perspective: 1400px; transform-style: preserve-3d; }
        .polaroid-card {
            position: absolute; background: #faf7f2; padding: 12px 12px 44px 12px; border-radius: 4px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(197, 155, 39, 0.35);
            transition: all 1.15s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform, opacity, filter;
        }
        @media (min-width: 640px) { .polaroid-card { padding: 16px 16px 56px 16px; } }
        .polaroid-caption { position: absolute; bottom: 10px; left: 16px; right: 16px; color: #162032; text-align: center; }

        .mosaic-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
        @media (min-width: 768px) { .mosaic-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; } }
        .mosaic-tile { position: relative; overflow: hidden; border-radius: 6px; border: 1px solid rgba(197, 155, 39, 0.18); transition: all 0.6s ease; cursor: pointer; aspect-ratio: 1; }
        .mosaic-tile img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.42) saturate(0.75); transition: all 0.6s ease; }
        .mosaic-tile:hover img { filter: brightness(0.85) saturate(1); transform: scale(1.08); }
        .mosaic-tile.is-current { border-color: #c59b27; box-shadow: 0 0 18px rgba(197, 155, 39, 0.65); z-index: 5; }
        .mosaic-tile.is-current img { filter: brightness(1.05) saturate(1.05); transform: scale(1.05); }
        .mosaic-spotlight { transition: all 0.75s cubic-bezier(0.22, 1, 0.36, 1); }

        .hud-element { transition: opacity 0.6s ease, transform 0.6s ease; }
        body.hud-hidden .hud-top { opacity: 0; transform: translateY(-24px); pointer-events: none; }
        body.hud-hidden .hud-bottom { opacity: 0; transform: translateY(24px); pointer-events: none; }
        body.hud-hidden { cursor: none; }

        .thumb-strip::-webkit-scrollbar { height: 5px; }
        .thumb-strip::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .thumb-strip::-webkit-scrollbar-thumb { background: rgba(197, 155, 39, 0.5); border-radius: 9999px; }
        .thumb-strip::-webkit-scrollbar-thumb:hover { background: #c59b27; }

        .gold-text-gradient {
            background: linear-gradient(135deg, #faf7f2 0%, #e2c56b 50%, #c59b27 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; color: #e2c56b; }
    </style>
</head>
<body class="font-sans antialiased h-screen w-screen relative select-none" id="appBody">

    <canvas id="goldParticlesCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-20 opacity-80"></canvas>
    <div class="fixed inset-0 cinematic-vignette pointer-events-none z-10"></div>

    <main id="stageContainer" class="relative w-full h-full overflow-hidden bg-night-950">

        <div id="loadingState" class="loading-state">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin"></i>
            <span class="text-sm">Cargando recuerdos...</span>
        </div>

        <div id="sceneKenBurns" class="hidden absolute inset-0 w-full h-full">
            <div id="kbLayerA" class="kb-slide active"><img id="kbImgA" src="" alt="Recuerdo" class="kb-img"></div>
            <div id="kbLayerB" class="kb-slide"><img id="kbImgB" src="" alt="Recuerdo" class="kb-img"></div>
        </div>

        <div id="scenePolaroid" class="hidden absolute inset-0 w-full h-full polaroid-stage flex items-center justify-center overflow-hidden">
            <img id="polaroidAmbientBg" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-20 blur-2xl scale-110 transition-all duration-1000">
            <div id="polaroidStack" class="relative w-full h-full flex items-center justify-center"></div>
        </div>

        <div id="sceneMosaic" class="hidden absolute inset-0 w-full h-full p-3 sm:p-6 flex items-center justify-center">
            <div id="mosaicGrid" class="mosaic-grid w-full h-full max-w-7xl mx-auto"></div>
            <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none z-10">
                <div id="mosaicSpotlight" class="mosaic-spotlight pointer-events-auto bg-night-800/95 backdrop-blur-md border-2 border-antique-400/80 rounded-2xl p-3 sm:p-4 shadow-2xl max-w-lg sm:max-w-xl w-full">
                    <div class="relative aspect-[4/3] w-full overflow-hidden rounded-xl bg-night-950 border border-antique-400/30">
                        <img id="mosaicSpotlightImg" src="" alt="Recuerdo destacado" class="w-full h-full object-contain bg-night-950 transition-transform duration-1000">
                        <div class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-night-900/85 border border-antique-400/50 text-antique-300 text-xs font-medium backdrop-blur-sm">
                            <span id="mosaicCounterBadge">1 / 1</span>
                        </div>
                    </div>
                    <div class="pt-3.5 px-1 text-center">
                        <p id="mosaicSpotlightDate" class="text-[11px] uppercase tracking-[0.2em] text-antique-300 font-semibold">Jorge Penado Siancas</p>
                        <h3 id="mosaicSpotlightTitle" class="font-serif text-xl sm:text-2xl text-ivory-100 font-semibold mt-0.5">Recuerdo</h3>
                    </div>
                </div>
            </div>
        </div>

        <div id="kenBurnsCaptionBox" class="hidden hud-element hud-bottom fixed bottom-28 sm:bottom-32 left-0 right-0 z-30 px-6 pointer-events-none flex justify-center">
            <div class="max-w-2xl text-center bg-night-900/55 backdrop-blur-md border border-antique-400/30 rounded-2xl px-6 py-3.5 shadow-2xl">
                <div class="flex items-center justify-center gap-2 text-antique-300 text-xs uppercase tracking-[0.22em] font-medium mb-1">
                    <span class="w-6 h-px bg-antique-400/60"></span>
                    <span id="captionYear">Ayacucho · Legado Eterno</span>
                    <span class="w-6 h-px bg-antique-400/60"></span>
                </div>
                <h2 id="captionTitle" class="font-serif text-xl sm:text-3xl font-semibold text-ivory-50 tracking-wide">Un recuerdo de Don Jorge</h2>
            </div>
        </div>

    </main>

    <header class="hud-element hud-top fixed top-0 left-0 right-0 z-40 bg-gradient-to-b from-night-950/90 via-night-900/65 to-transparent pt-4 pb-8 px-4 sm:px-8">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
            <div class="text-center lg:text-left">
                <div class="flex items-center justify-center lg:justify-start gap-2.5">
                    <span class="font-script text-3xl sm:text-4xl gold-text-gradient leading-none">Jorge Penado Siancas</span>
                    <span class="hidden sm:inline-block px-2.5 py-0.5 rounded-full bg-antique-400/15 border border-antique-400/40 text-antique-300 text-[11px] tracking-widest uppercase">
                        1942 – 2026
                    </span>
                </div>
                <p class="text-xs sm:text-sm text-ivory-200/80 font-light tracking-wider mt-0.5">
                    En memoria y gratitud · <span class="text-antique-300 font-medium" id="totalPhotosSubtitle">Recuerdos de Vida</span>
                </p>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-2">
                <div class="inline-flex items-center bg-night-800/90 backdrop-blur-md p-1 rounded-xl border border-antique-400/35 shadow-lg" role="group" aria-label="Modos de transición">
                    <button data-mode="kenburns" class="mode-btn active flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-antique-400 text-night-950 shadow transition">
                        <i data-lucide="film" class="w-3.5 h-3.5"></i><span>Cine Ken Burns</span>
                    </button>
                    <button data-mode="polaroid" class="mode-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-ivory-200 hover:text-antique-300 transition">
                        <i data-lucide="layers" class="w-3.5 h-3.5"></i><span>Polaroid 3D</span>
                    </button>
                    <button data-mode="mosaic" class="mode-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-ivory-200 hover:text-antique-300 transition">
                        <i data-lucide="grid" class="w-3.5 h-3.5"></i><span>Mosaico Vivo</span>
                    </button>
                </div>

                <button id="cleanProjectionBtn" class="p-2 rounded-xl bg-night-800/90 hover:bg-night-700 border border-antique-400/30 text-ivory-200 hover:text-antique-300 transition backdrop-blur-md" title="Ocultar controles para proyección limpia">
                    <i data-lucide="eye-off" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <footer class="hud-element hud-bottom fixed bottom-0 left-0 right-0 z-40 bg-gradient-to-t from-night-950/95 via-night-900/90 to-transparent pt-6 pb-3 px-4 sm:px-8">
        <div class="max-w-6xl mx-auto space-y-2.5">
            <div id="thumbnailDrawer" class="hidden bg-night-800/90 backdrop-blur-md border border-antique-400/30 rounded-xl p-2 shadow-2xl">
                <div id="thumbnailStrip" class="thumb-strip flex items-center gap-2 overflow-x-auto pb-1"></div>
            </div>

            <div class="w-full h-1 bg-night-700/80 rounded-full overflow-hidden">
                <div id="slideProgressBar" class="h-full bg-gradient-to-r from-antique-500 via-antique-400 to-antique-300 w-0 transition-none"></div>
            </div>

            <div class="flex items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-2.5">
                    <button id="toggleThumbsBtn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-night-800/90 hover:bg-night-700 border border-antique-400/30 text-ivory-100 transition" title="Ver miniaturas">
                        <i data-lucide="gallery-horizontal" class="w-3.5 h-3.5 text-antique-400"></i>
                        <span id="counterLabel" class="font-medium">Recuerdo <strong class="text-antique-300">1</strong> de 1</span>
                    </button>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <button id="prevBtn" class="p-2 rounded-full bg-night-800/90 hover:bg-night-700 border border-antique-400/30 text-ivory-100 hover:text-antique-300 transition" title="Recuerdo anterior">
                        <i data-lucide="skip-back" class="w-4 h-4"></i>
                    </button>
                    <button id="playPauseBtn" class="flex items-center gap-2 px-4 py-2 rounded-full bg-antique-400 hover:bg-antique-300 text-night-950 font-semibold shadow-lg shadow-antique-400/20 transition" title="Pausar o Reanudar (Espacio)">
                        <i id="playPauseIcon" data-lucide="pause" class="w-4 h-4"></i>
                        <span id="playPauseText" class="hidden sm:inline">En Curso</span>
                    </button>
                    <button id="nextBtn" class="p-2 rounded-full bg-night-800/90 hover:bg-night-700 border border-antique-400/30 text-ivory-100 hover:text-antique-300 transition" title="Siguiente recuerdo">
                        <i data-lucide="skip-forward" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <div class="hidden sm:inline-flex items-center bg-night-800/90 rounded-lg p-0.5 border border-antique-400/30" title="Duración por fotografía">
                        <button data-speed="3000" class="speed-btn px-2 py-1 rounded-md text-[11px] font-medium text-ivory-200/75 hover:text-white transition">3s</button>
                        <button data-speed="5000" class="speed-btn active px-2 py-1 rounded-md text-[11px] font-semibold bg-antique-400/25 text-antique-300 transition">5s</button>
                        <button data-speed="8000" class="speed-btn px-2 py-1 rounded-md text-[11px] font-medium text-ivory-200/75 hover:text-white transition">8s</button>
                    </div>
                    <button id="fullscreenBtn" class="p-2 rounded-lg bg-night-800/90 hover:bg-night-700 border border-antique-400/30 text-ivory-100 hover:text-antique-300 transition" title="Pantalla Completa">
                        <i id="fullscreenIcon" data-lucide="maximize" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </footer>

    <button id="restoreHudBtn" class="hidden fixed top-4 right-4 z-50 px-3 py-1.5 rounded-full bg-night-900/80 border border-antique-400/50 text-antique-300 text-xs backdrop-blur-md shadow-lg hover:bg-night-800 transition">
        Mostrar controles
    </button>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 hidden items-center gap-2 px-4 py-2.5 rounded-xl bg-night-900/95 border border-antique-400 text-ivory-50 text-xs font-medium shadow-2xl backdrop-blur-md">
        <i data-lucide="sparkles" class="w-4 h-4 text-antique-400"></i>
        <span id="toastText">Galería actualizada</span>
    </div>

    <script>
        const SUPABASE_URL = 'https://zqdfxiuqkuoblzozgqrk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxZGZ4aXVxa3VvYmx6b3pncXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTc1OTUsImV4cCI6MjEwNTI3MzU5NX0.W5k7UPxj-GGX5LNfp2HczwK8cIQjovR_BhsL6OyTPn8';
        const MEMORIAL_ID = '81868d6c-2185-402b-94c2-0875a463b96e';

        let photos = [];
        let currentIndex = 0;
        let currentMode = 'kenburns';
        let isPlaying = true;
        let slideDuration = 5000;
        let activeKbLayer = 'A';
        let progressStartTime = performance.now();
        let progressRafId = null;
        let hudIdleTimer = null;
        let manualHudLockedHidden = false;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initGoldParticles();
            loadRealPhotos();
            setupEventListeners();
        });

        async function loadRealPhotos() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/memorial_photos?memorial_id=eq.${MEMORIAL_ID}&select=url,caption&order=sort_order`,
                    { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
                );
                const rows = await res.json();
                photos = (rows || []).map((r, i) => ({
                    id: i + 1,
                    src: r.url,
                    thumb: r.url,
                    title: r.caption || `Recuerdo ${i + 1}`,
                    year: 'Jorge Penado Siancas',
                }));
            } catch (e) {
                photos = [];
            }

            document.getElementById('loadingState').classList.add('hidden');

            if (photos.length === 0) {
                document.getElementById('loadingState').classList.remove('hidden');
                document.getElementById('loadingState').innerHTML = '<span class="text-sm text-ivory-200/70">Aún no hay fotografías cargadas en el álbum.</span>';
                return;
            }

            document.getElementById('totalPhotosSubtitle').textContent = `${photos.length} Recuerdo${photos.length === 1 ? '' : 's'} de Vida`;
            document.getElementById('sceneKenBurns').classList.remove('hidden');
            document.getElementById('kenBurnsCaptionBox').classList.remove('hidden');

            buildThumbnailStrip();
            buildMosaicGrid();
            showSlide(0, true);
            startPlaybackLoop();
            resetHudIdleTimer();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = message;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('flex'); }, 3400);
        }

        function buildThumbnailStrip() {
            const strip = document.getElementById('thumbnailStrip');
            strip.innerHTML = photos.map((p, idx) => `
                <button onclick="goToSlide(${idx})" id="thumb-${idx}"
                        class="relative shrink-0 w-14 h-10 sm:w-16 sm:h-11 rounded-md overflow-hidden border-2 transition ${idx === currentIndex ? 'border-antique-400 scale-105 shadow-md' : 'border-transparent opacity-60 hover:opacity-100'}"
                        title="Recuerdo ${idx + 1}: ${p.title}">
                    <img src="${p.thumb}" loading="lazy" alt="${p.title}" class="w-full h-full object-cover">
                    <span class="absolute bottom-0 right-0 bg-night-950/80 text-[9px] text-ivory-100 px-1 leading-tight">${idx + 1}</span>
                </button>
            `).join('');
        }

        function buildMosaicGrid() {
            const grid = document.getElementById('mosaicGrid');
            const cellCount = Math.min(50, Math.max(photos.length, 10));
            const cells = Array.from({ length: cellCount }, (_, idx) => {
                const p = photos[idx % photos.length];
                return `
                    <div onclick="goToSlide(${idx % photos.length})" id="mosaic-tile-${idx}" class="mosaic-tile">
                        <img src="${p.thumb}" loading="lazy" alt="${p.title}">
                    </div>
                `;
            });
            grid.innerHTML = cells.join('');
        }

        function showSlide(index, instant = false) {
            const total = photos.length;
            if (total === 0) return;
            currentIndex = ((index % total) + total) % total;
            const photo = photos[currentIndex];

            document.getElementById('counterLabel').innerHTML = `Recuerdo <strong class="text-antique-300">${currentIndex + 1}</strong> de ${total}`;
            document.getElementById('captionYear').textContent = photo.year;
            document.getElementById('captionTitle').textContent = photo.title;

            document.querySelectorAll('#thumbnailStrip button').forEach((btn, i) => {
                if (i === currentIndex) {
                    btn.classList.add('border-antique-400', 'scale-105', 'opacity-100');
                    btn.classList.remove('border-transparent', 'opacity-60');
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    btn.classList.remove('border-antique-400', 'scale-105', 'opacity-100');
                    btn.classList.add('border-transparent', 'opacity-60');
                }
            });

            if (currentMode === 'kenburns') renderKenBurnsTransition(photo);
            else if (currentMode === 'polaroid') renderPolaroid3DTransition(currentIndex);
            else if (currentMode === 'mosaic') renderMosaicSpotlightTransition(currentIndex);

            progressStartTime = performance.now();
        }

        function renderKenBurnsTransition(photo) {
            const layerA = document.getElementById('kbLayerA');
            const layerB = document.getElementById('kbLayerB');
            const imgA = document.getElementById('kbImgA');
            const imgB = document.getElementById('kbImgB');
            const motionClass = `kb-motion-${currentIndex % 4}`;

            if (activeKbLayer === 'A') {
                imgB.src = photo.src; imgB.className = `kb-img ${motionClass}`;
                layerB.classList.add('active'); layerB.classList.remove('previous');
                layerA.classList.remove('active'); layerA.classList.add('previous');
                activeKbLayer = 'B';
            } else {
                imgA.src = photo.src; imgA.className = `kb-img ${motionClass}`;
                layerA.classList.add('active'); layerA.classList.remove('previous');
                layerB.classList.remove('active'); layerB.classList.add('previous');
                activeKbLayer = 'A';
            }
        }

        function renderPolaroid3DTransition(centerIdx) {
            const stack = document.getElementById('polaroidStack');
            const ambientBg = document.getElementById('polaroidAmbientBg');
            const total = photos.length;
            ambientBg.src = photos[centerIdx].src;

            const offsets = [-2, -1, 0, 1, 2];
            const angles = [-14, -7, 0, 7, 14];
            const translateX = [-46, -24, 0, 24, 46];
            const translateZ = [-260, -130, 40, -130, -260];

            stack.innerHTML = offsets.map((offset, i) => {
                const idx = ((centerIdx + offset) % total + total) % total;
                const item = photos[idx];
                const isCenter = offset === 0;
                const zIndex = isCenter ? 20 : 10 - Math.abs(offset);
                const opacity = isCenter ? 1 : (Math.abs(offset) === 1 ? 0.65 : 0.3);
                const blur = isCenter ? '0px' : (Math.abs(offset) === 1 ? '1.5px' : '3px');

                return `
                    <div onclick="goToSlide(${idx})"
                         class="polaroid-card cursor-pointer w-[76vw] max-w-[340px] sm:max-w-[440px] md:max-w-[500px]"
                         style="z-index:${zIndex}; opacity:${opacity}; filter:blur(${blur});
                                transform: translate3d(${translateX[i]}%, ${Math.abs(offset) * 10}px, ${translateZ[i]}px) rotateZ(${angles[i]}deg);">
                        <div class="aspect-[4/3] w-full overflow-hidden bg-night-900 rounded-sm">
                            <img src="${item.src}" alt="${item.title}" class="w-full h-full object-contain bg-night-900">
                        </div>
                        <div class="polaroid-caption">
                            <p class="font-serif text-sm sm:text-lg font-bold text-night-900 truncate">${item.title}</p>
                            <p class="text-[10px] sm:text-xs text-antique-600 font-medium tracking-wider uppercase">${idx + 1}/${total}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMosaicSpotlightTransition(centerIdx) {
            const photo = photos[centerIdx];
            const spotlight = document.getElementById('mosaicSpotlight');
            const img = document.getElementById('mosaicSpotlightImg');

            spotlight.style.transform = 'scale(0.95)';
            spotlight.style.opacity = '0.75';

            setTimeout(() => {
                img.src = photo.src;
                document.getElementById('mosaicSpotlightDate').textContent = photo.year;
                document.getElementById('mosaicSpotlightTitle').textContent = photo.title;
                document.getElementById('mosaicCounterBadge').textContent = `${centerIdx + 1} / ${photos.length}`;
                spotlight.style.transform = 'scale(1)';
                spotlight.style.opacity = '1';
            }, 180);

            const cellCount = document.querySelectorAll('.mosaic-tile').length;
            document.querySelectorAll('.mosaic-tile').forEach((tile, idx) => {
                tile.classList.toggle('is-current', idx % photos.length === centerIdx);
            });
        }

        function startPlaybackLoop() {
            const progressBar = document.getElementById('slideProgressBar');
            function tick(now) {
                if (isPlaying && photos.length > 0) {
                    const elapsed = now - progressStartTime;
                    const pct = Math.min(100, (elapsed / slideDuration) * 100);
                    progressBar.style.width = `${pct}%`;
                    if (elapsed >= slideDuration) showSlide(currentIndex + 1);
                }
                progressRafId = requestAnimationFrame(tick);
            }
            cancelAnimationFrame(progressRafId);
            progressRafId = requestAnimationFrame(tick);
        }

        window.goToSlide = function (idx) { showSlide(idx); };

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('playPauseIcon');
            const text = document.getElementById('playPauseText');
            if (isPlaying) {
                progressStartTime = performance.now();
                icon.setAttribute('data-lucide', 'pause'); text.textContent = 'En Curso';
            } else {
                icon.setAttribute('data-lucide', 'play'); text.textContent = 'Pausado';
            }
            lucide.createIcons();
        }

        function switchMode(newMode) {
            currentMode = newMode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = btn.dataset.mode === newMode
                    ? 'mode-btn active flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-antique-400 text-night-950 shadow transition'
                    : 'mode-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-ivory-200 hover:text-antique-300 transition';
            });

            document.getElementById('sceneKenBurns').classList.toggle('hidden', newMode !== 'kenburns');
            document.getElementById('kenBurnsCaptionBox').classList.toggle('hidden', newMode !== 'kenburns');
            document.getElementById('scenePolaroid').classList.toggle('hidden', newMode !== 'polaroid');
            document.getElementById('sceneMosaic').classList.toggle('hidden', newMode !== 'mosaic');

            if (photos.length > 0) showSlide(currentIndex, true);
        }

        function initGoldParticles() {
            const canvas = document.getElementById('goldParticlesCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

            const particleCount = window.innerWidth < 768 ? 28 : 52;
            const particles = Array.from({ length: particleCount }, () => ({
                x: Math.random() * width, y: Math.random() * height,
                radius: Math.random() * 2.2 + 0.6,
                vx: (Math.random() - 0.5) * 0.35, vy: -(Math.random() * 0.45 + 0.15),
                alpha: Math.random() * 0.65 + 0.2, phase: Math.random() * Math.PI * 2
            }));

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.x += p.vx + Math.sin(p.phase) * 0.15;
                    p.y += p.vy; p.phase += 0.015;
                    if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;

                    const twinkle = p.alpha * (0.65 + 0.35 * Math.sin(p.phase * 2));
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
                    grad.addColorStop(0, `rgba(226, 197, 107, ${twinkle})`);
                    grad.addColorStop(1, 'rgba(197, 155, 39, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2); ctx.fill();
                });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();
        }

        function resetHudIdleTimer() {
            if (manualHudLockedHidden) return;
            document.body.classList.remove('hud-hidden');
            clearTimeout(hudIdleTimer);
            hudIdleTimer = setTimeout(() => {
                const thumbsOpen = !document.getElementById('thumbnailDrawer').classList.contains('hidden');
                if (!thumbsOpen && isPlaying) document.body.classList.add('hud-hidden');
            }, 4500);
        }

        function setupEventListeners() {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', () => switchMode(btn.dataset.mode)));

            document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
            document.getElementById('prevBtn').addEventListener('click', () => showSlide(currentIndex - 1));
            document.getElementById('nextBtn').addEventListener('click', () => showSlide(currentIndex + 1));

            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    slideDuration = parseInt(btn.dataset.speed, 10);
                    progressStartTime = performance.now();
                    document.querySelectorAll('.speed-btn').forEach(b => {
                        b.className = 'speed-btn px-2 py-1 rounded-md text-[11px] font-medium text-ivory-200/75 hover:text-white transition';
                    });
                    btn.className = 'speed-btn active px-2 py-1 rounded-md text-[11px] font-semibold bg-antique-400/25 text-antique-300 transition';
                    showToast(`Velocidad ajustada a ${slideDuration / 1000} segundos por foto`);
                });
            });

            document.getElementById('toggleThumbsBtn').addEventListener('click', () => {
                const drawer = document.getElementById('thumbnailDrawer');
                drawer.classList.toggle('hidden');
                if (!drawer.classList.contains('hidden')) {
                    const activeThumb = document.getElementById(`thumb-${currentIndex}`);
                    if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                }
            });

            document.getElementById('fullscreenBtn').addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
                else document.exitFullscreen().catch(() => {});
            });

            document.getElementById('cleanProjectionBtn').addEventListener('click', () => {
                manualHudLockedHidden = true;
                document.body.classList.add('hud-hidden');
                document.getElementById('restoreHudBtn').classList.remove('hidden');
            });

            document.getElementById('restoreHudBtn').addEventListener('click', () => {
                manualHudLockedHidden = false;
                document.body.classList.remove('hud-hidden');
                document.getElementById('restoreHudBtn').classList.add('hidden');
                resetHudIdleTimer();
            });

            document.addEventListener('keydown', (e) => {
                resetHudIdleTimer();
                if (e.key === 'ArrowRight') showSlide(currentIndex + 1);
                if (e.key === 'ArrowLeft') showSlide(currentIndex - 1);
                if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
            });

            ['mousemove', 'touchstart', 'click'].forEach(evt => document.addEventListener(evt, resetHudIdleTimer, { passive: true }));
        }
    </script>
</body>
</html>
